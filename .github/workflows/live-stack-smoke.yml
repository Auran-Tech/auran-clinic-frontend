name: Live Stack Browser Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-stack:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Auran_CI_Password_123!
        ports:
          - 1433:1433
    env:
      ConnectionStrings__DefaultConnection: Server=localhost,1433;Database=AuranClinicCi;User Id=sa;Password=Auran_CI_Password_123!;TrustServerCertificate=True;Encrypt=False
      Jwt__SigningKey: Auran_CI_Only_JWT_Signing_Key_Not_A_Secret_2026
      ASPNETCORE_URLS: http://127.0.0.1:5085
      ASPNETCORE_ENVIRONMENT: Production
      E2E_API_BASE_URL: http://127.0.0.1:5085/api
      Cors__AllowedOrigins__0: http://127.0.0.1:4173
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Checkout public backend
        uses: actions/checkout@v4
        with:
          repository: Auran-Tech/auran-clinic-backend
          path: backend

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build backend and migrate SQL
        shell: bash
        run: |
          cd backend
          dotnet tool restore
          dotnet restore Auran.Clinic.sln
          dotnet publish src/Auran.Clinic.Api/Auran.Clinic.Api.csproj -c Release -o ./artifacts/api
          for attempt in {1..30}; do
            if dotnet ef database update --project src/Auran.Clinic.Infrastructure/Auran.Clinic.Infrastructure.csproj --startup-project src/Auran.Clinic.Api/Auran.Clinic.Api.csproj -c Release; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Start real backend
        shell: bash
        run: |
          cd backend/artifacts/api
          nohup dotnet Auran.Clinic.Api.dll > /tmp/auran-api.log 2>&1 &
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:5085/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/auran-api.log
          exit 1

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend against real API
        run: npm run build
        env:
          VITE_API_BASE_URL: http://127.0.0.1:5085/api

      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium

      - name: Run live-stack browser smoke
        run: npx playwright test e2e/live-stack.spec.mjs

      - name: Upload browser test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-stack-playwright-results
          path: test-results/
          if-no-files-found: ignore

      - name: Upload backend logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-stack-backend-logs
          path: /tmp/auran-api.log
          if-no-files-found: ignore
